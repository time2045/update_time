# 局域网 NTP 校时 App 自动编译
# 触发方式：push、PR、或手动 workflow_dispatch
name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 项目未内置 gradle wrapper，直接用指定版本的 gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests
        run: >
          gradle :app:testDebugUnitTest
          --no-daemon

      - name: Build APK (debug + release)
        run: >
          gradle assembleDebug assembleRelease
          -PciBuildNumber=${{ github.run_number }}
          --no-daemon

      # 产物重命名：ntp-sync-release-v<版本号>.apk / ntp-sync-debug-v<版本号>.apk
      # （版本号与构建参数一致，解压即见文件名，不用猜是哪次编译的包）
      - name: Rename APKs
        run: |
          VER="${{ github.run_number }}"
          mkdir -p renamed
          cp app/build/outputs/apk/release/*.apk "renamed/ntp-sync-release-v1.0.${VER}.apk"
          cp app/build/outputs/apk/debug/*.apk "renamed/ntp-sync-debug-v1.0.${VER}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ntp-sync-apk
          path: renamed/ntp-sync-release-v*.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ntp-sync-debug-apk
          path: renamed/ntp-sync-debug-v*.apk
          if-no-files-found: error

      - name: Publish Release with APKs
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            renamed/ntp-sync-release-v1.0.${{ github.run_number }}.apk
            renamed/ntp-sync-debug-v1.0.${{ github.run_number }}.apk
          body: |
            ### 📱 安装包直接下载（手机点击直接安装）
            - **Release 安装包**：[ntp-sync-release-v1.0.${{ github.run_number }}.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/ntp-sync-release-v1.0.${{ github.run_number }}.apk)
            - **Debug 安装包**：[ntp-sync-debug-v1.0.${{ github.run_number }}.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/ntp-sync-debug-v1.0.${{ github.run_number }}.apk)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
